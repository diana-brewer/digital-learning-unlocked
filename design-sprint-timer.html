<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capstone Design Sprint — 17:00</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0D1520; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; user-select: none; }
  .label { font-size: clamp(18px, 3vw, 42px); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 2vh; }
  .timer { font-size: clamp(80px, 24vw, 420px); font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 0.01em; transition: color 0.4s; }
  .timer.warn { color: #FFB020; }
  .timer.crit { color: #FF5A4E; }
  .timer.done { color: #3DDC84; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .banner { min-height: 8vh; display: flex; align-items: center; font-size: clamp(16px, 2.6vw, 36px); font-weight: 600; color: #FFB020; opacity: 0; transition: opacity 0.5s; margin-top: 1.5vh; }
  .banner.show { opacity: 1; }
  .controls { position: fixed; bottom: 4vh; display: flex; gap: 14px; }
  button { background: rgba(255,255,255,0.10); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.28); border-radius: 12px; font-size: clamp(14px, 1.6vw, 22px); font-weight: 600; padding: 1vh 2.4vw; cursor: pointer; transition: background 0.2s; }
  button:hover { background: rgba(255,255,255,0.22); }
  .hint { position: fixed; top: 3vh; font-size: clamp(11px, 1.1vw, 16px); color: rgba(255,255,255,0.35); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="hint">Space = start/pause &nbsp;·&nbsp; R = reset &nbsp;·&nbsp; F = fullscreen &nbsp;·&nbsp; time checks at 5 / 10 / 15 min</div>
  <div class="label">Capstone Design Sprint</div>
  <div class="timer" id="timer">17:00</div>
  <div class="banner" id="banner"></div>
  <div class="controls">
    <button id="btn-start">Start</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-fs">Fullscreen</button>
  </div>
<script>
(function () {
  const DURATION = 17 * 60 * 1000;
  const CHECKINS = [
    { at: 12 * 60, msg: '5 min in — circulate and check on stuck groups' },
    { at:  7 * 60, msg: '10 min in — groups should be selecting a tool' },
    { at:  2 * 60, msg: '15 min in — push groups to write their implementation plan' }
  ];
  const el = document.getElementById('timer');
  const banner = document.getElementById('banner');
  const btnStart = document.getElementById('btn-start');
  let remaining = DURATION, running = false, lastTick = null, fired = new Set(), bannerTimer = null;

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function beep(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      o.start(); o.stop(ctx.currentTime + 0.45);
    } catch (e) {}
  }
  function showBanner(msg) {
    banner.textContent = msg; banner.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove('show'), 5000);
  }
  function render() {
    el.textContent = fmt(remaining);
    el.classList.toggle('warn', remaining <= 5 * 60 * 1000 && remaining > 60 * 1000);
    el.classList.toggle('crit', remaining <= 60 * 1000 && remaining > 0);
    el.classList.toggle('done', remaining <= 0);
    if (remaining <= 0 && running) stop();
    const secs = remaining / 1000;
    CHECKINS.forEach((c, i) => {
      if (!fired.has(i) && secs <= c.at && secs > c.at - 1.5) { fired.add(i); showBanner(c.msg); beep(880); }
    });
  }
  function tick(now) {
    remaining -= now - lastTick; lastTick = now;
    if (remaining <= 0) { remaining = 0; render(); stop(); beep(440); setTimeout(() => beep(440), 350); showBanner('Time — move to the share-out'); return; }
    render(); requestAnimationFrame(tick);
  }
  function start() {
    if (running || remaining <= 0) return;
    running = true; lastTick = performance.now(); btnStart.textContent = 'Pause';
    requestAnimationFrame(tick);
  }
  function stop() { running = false; btnStart.textContent = 'Start'; }
  function reset() {
    stop(); remaining = DURATION; fired = new Set(); banner.classList.remove('show'); render();
  }
  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  btnStart.addEventListener('click', () => running ? stop() : start());
  document.getElementById('btn-reset').addEventListener('click', reset);
  document.getElementById('btn-fs').addEventListener('click', fullscreen);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); }
    if (e.key === 'r' || e.key === 'R') reset();
    if (e.key === 'f' || e.key === 'F') fullscreen();
  });
  render();
})();
</script>
</body>
</html>
